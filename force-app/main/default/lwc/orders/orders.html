<template>
    <!-- Message d'erreur si CA vide ou 0 -->
    <template if:true={showError}>
        <div class="slds-box slds-theme_error">
            <h1>Erreur, pas de commandes rattachées à ce compte ou le montant des commandes est inférieur ou égal à 0.</h1>
        </div>
    </template>

    <!-- Affichage du CA si > 0 -->
    <template if:true={showSuccess}>
        <div class="slds-box slds-theme_success">
            <h1>Total des Commandes : {sumOrdersOfCurrentAccount}</h1>
        </div>
    </template>
</template>
